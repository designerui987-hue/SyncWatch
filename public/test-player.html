<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SyncWatch Authorized HTML5 Test Player</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      max-width: 640px;
      width: 100%;
    }
    video {
      width: 100%;
      border-radius: 8px;
      margin-top: 12px;
      background: #000;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: #059669;
      color: #ecfdf5;
    }
    .log {
      margin-top: 16px;
      background: #020617;
      border: 1px solid #1e293b;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      border-radius: 6px;
      max-height: 120px;
      overflow-y: auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin: 0; font-size: 18px;">Authorized HTML5 Test Harness</h2>
      <span class="badge">Verified Public Domain</span>
    </div>
    <p style="font-size: 13px; color: #94a3b8; margin: 8px 0 16px 0;">
      Test player for the SyncWatch Companion Extension MVP. Communicates via scoped window messages.
    </p>

    <!-- Public Domain Big Buck Bunny sample video -->
    <video id="test-video" controls playsinline>
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <div class="log" id="event-log">Listening for player events...</div>
  </div>

  <script>
    const video = document.getElementById('test-video');
    const log = document.getElementById('event-log');

    function appendLog(msg) {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      log.prepend(line);
    }

    video.addEventListener('play', () => appendLog('Event: Play'));
    video.addEventListener('pause', () => appendLog('Event: Pause'));
    video.addEventListener('seeked', () => appendLog(`Event: Seeked to ${video.currentTime.toFixed(2)}s`));
  </script>
</body>
</html>
